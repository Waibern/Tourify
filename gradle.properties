# Pengaturan Gradle untuk seluruh project.
# Nilai dari Android Studio akan menggantikan pengaturan di file ini.
# Panduan lengkapnya ada di:
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Atur argumen JVM yang dipakai proses Gradle.
# Ubah nilai ini kalau perlu menyesuaikan pemakaian memori.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kalau diaktifkan, Gradle bisa membangun beberapa modul bersamaan.
# Pakai hanya kalau modul tidak saling bergantung. Panduannya:
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Cache konfigurasi membantu Gradle melewati tahap setup kalau build script tidak berubah.
# Gradle juga mengoptimalkan cara menjalankan task.
org.gradle.configuration-cache=true
# Pilih gaya kode Kotlin untuk project ini: "official" atau "obsolete".
kotlin.code.style=official
