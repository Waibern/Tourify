# shortcut: hitungan berbasis IP dibagi oleh tester di NAT yang sama; naikkan ke kuota per akun jika pengguna bertambah.
map $uri $tourify_auth_rate_key {
    default "";
    ~^/tourify-api/(register|login|dashboard_auth)\.php$ "$binary_remote_addr:$request_method:$uri";
}

map $uri $tourify_chat_rate_key {
    default "";
    =/tourify-api/chat.php $binary_remote_addr;
}

limit_req_zone $tourify_auth_rate_key zone=tourify_auth:10m rate=10r/m;
limit_req_zone $tourify_chat_rate_key zone=tourify_chat:10m rate=10r/m;
